# CloudFormation template snippet for Lambda environment variables

Environment:
  Variables:
    SSO_ROLE_ARN: !Sub "arn:aws:iam::${AWS::AccountId}:role/GlobalReaderRole"
    F5_SECRET_NAME: "f5-distributed-cloud-api-credentials"
    CORE_NETWORK_ACCOUNT_ID: !Ref CoreNetworkAccountId
    WORKLOAD_ACCOUNT_IDS: !Ref WorkloadAccountIds
    ATHENA_DATABASE: "centralized_logging"
    ATHENA_OUTPUT_BUCKET: !Sub "aws-ops-agent-athena-results-${AWS::AccountId}-${AWS::Region}"
    BEDROCK_MODEL_ID: "us.amazon.nova-pro-v1:0"
    BEDROCK_REGION: "us-east-1"
    F5_CACHE_TABLE: "aws-ops-agent-f5-cache"

# Parameters section
Parameters:
  CoreNetworkAccountId:
    Type: String
    Description: AWS Account ID for Core Network resources
    AllowedPattern: "[0-9]{12}"
    
  WorkloadAccountIds:
    Type: CommaDelimitedList
    Description: Comma-separated list of Workload Account IDs