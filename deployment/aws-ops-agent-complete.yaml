AWSTemplateFormatVersion: '2010-09-09'
Description: 'Complete AWS Operations Agent infrastructure deployment'

Parameters:
  # General Parameters
  ProjectName:
    Type: String
    Default: aws-ops-agent
    Description: Name of the project (used for resource naming)
    
  Environment:
    Type: String
    Default: prod
    Description: Environment name (dev, staging, prod)
    AllowedValues: [dev, staging, prod]
  
  # IAM Parameters
  GlobalReaderRoleName:
    Type: String
    Default: GlobalReaderRole
    Description: Name of the SSO Global Reader Role
  
  CoreNetworkAccountId:
    Type: String
    Description: AWS Account ID for Core Network resources
    AllowedPattern: '[0-9]{12}'
  
  WorkloadAccountIds:
    Type: CommaDelimitedList
    Description: Comma-separated list of Workload Account IDs
  
  # F5 Parameters
  F5SecretName:
    Type: String
    Default: f5-distributed-cloud-api-credentials
    Description: Name of the F5 API credentials secret in Secrets Manager
  
  F5ApiUrl:
    Type: String
    Description: F5 Distributed Cloud API URL
    NoEcho: true
  
  F5ApiToken:
    Type: String
    Description: F5 API Token
    NoEcho: true
  
  F5Namespace:
    Type: String
    Default: system
    Description: F5 Namespace
  
  # Lambda Parameters
  LambdaTimeout:
    Type: Number
    Default: 300
    MinValue: 30
    MaxValue: 900
    Description: Lambda function timeout in seconds
  
  LambdaMemorySize:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240
    Description: Lambda function memory size in MB
  
  # Athena Parameters
  AthenaDatabase:
    Type: String
    Default: centralized_logging
    Description: Athena database name for log queries
  
  AthenaOutputBucket:
    Type: String
    Description: S3 bucket for Athena query results (will be created if not exists)
  
  # API Gateway Parameters
  ApiStageName:
    Type: String
    Default: prod
    Description: API Gateway stage name
  
  EnableApiKey:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable API key authentication

Resources:
  # S3 Bucket for Athena Results
  AthenaResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref AthenaOutputBucket
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldQueryResults
            Status: Enabled
            ExpirationInDays: 7
      Tags:
        - Key: Application
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-execution-role-${Environment}'
      Description: !Sub 'Execution role for ${ProjectName} Lambda function'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub '${ProjectName}-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # CloudWatch Logs
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-${Environment}:*'
              
              # STS AssumeRole for SSO Global Reader
              - Sid: AssumeSSORoles
                Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${GlobalReaderRoleName}'
                  - !Sub 'arn:aws:iam::${CoreNetworkAccountId}:role/${GlobalReaderRoleName}'
                  - !Sub 'arn:aws:iam::*:role/${GlobalReaderRoleName}'
              
              # Secrets Manager Access
              - Sid: SecretsManagerAccess
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${F5SecretName}-*'
              
              # Amazon Bedrock Access (Nova 2 Lite cross-region inference + Claude fallback)
              - Sid: BedrockAccess
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - 'arn:aws:bedrock:*:*:inference-profile/us.amazon.nova-*'
                  - 'arn:aws:bedrock:*::foundation-model/amazon.nova-*'
                  - 'arn:aws:bedrock:*::foundation-model/anthropic.claude-*'
      Tags:
        - Key: Application
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # F5 API Credentials Secret
  F5ApiCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Ref F5SecretName
      Description: !Sub 'F5 Distributed Cloud API credentials for ${ProjectName}'
      SecretString: !Sub |
        {
          "api_url": "${F5ApiUrl}",
          "api_token": "${F5ApiToken}",
          "namespace": "${F5Namespace}"
        }
      Tags:
        - Key: Application
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # Secret Resource Policy
  SecretResourcePolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      SecretId: !Ref F5ApiCredentialsSecret
      ResourcePolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowLambdaAccess
            Effect: Allow
            Principal:
              AWS: !GetAtt LambdaExecutionRole.Arn
            Action: secretsmanager:GetSecretValue
            Resource: '*'

  # Lambda Layer (placeholder - actual layer must be created separately)
  LambdaLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: !Sub '${ProjectName}-dependencies-${Environment}'
      Description: !Sub 'Dependencies layer for ${ProjectName}'
      Content:
        S3Bucket: !Sub '${ProjectName}-deployment-${AWS::AccountId}-${AWS::Region}'
        S3Key: lambda-layer.zip
      CompatibleRuntimes:
        - python3.11
      CompatibleArchitectures:
        - x86_64

  # Lambda Function
  LambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}'
      Description: !Sub 'AI-powered AWS operations assistant - ${Environment}'
      Runtime: python3.11
      Handler: src.lambda_handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: !Ref LambdaTimeout
      MemorySize: !Ref LambdaMemorySize
      Architectures:
        - x86_64
      Layers:
        - !Ref LambdaLayer
      Code:
        S3Bucket: !Sub '${ProjectName}-deployment-${AWS::AccountId}-${AWS::Region}'
        S3Key: aws-ops-agent-function.zip
      Environment:
        Variables:
          SSO_ROLE_ARN: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${GlobalReaderRoleName}'
          F5_SECRET_NAME: !Ref F5SecretName
          CORE_NETWORK_ACCOUNT_ID: !Ref CoreNetworkAccountId
          WORKLOAD_ACCOUNT_IDS: !Join [',', !Ref WorkloadAccountIds]
          ATHENA_DATABASE: !Ref AthenaDatabase
          ATHENA_OUTPUT_BUCKET: !Ref AthenaResultsBucket
          BEDROCK_MODEL_ID: 'us.amazon.nova-pro-v1:0'
          BEDROCK_REGION: 'us-east-1'
          LOG_LEVEL: INFO
      Tags:
        - Key: Application
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # CloudWatch Log Group
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Environment}'
      RetentionInDays: 7
      Tags:
        - Key: Application
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # API Gateway REST API
  ApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${ProjectName}-api-${Environment}'
      Description: !Sub 'REST API for ${ProjectName} - ${Environment}'
      EndpointConfiguration:
        Types:
          - REGIONAL
      Tags:
        - Key: Application
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # API Gateway Resource
  ApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: query

  # API Gateway Method
  ApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ApiResource
      HttpMethod: POST
      AuthorizationType: !If [EnableApiKeyCondition, AWS_IAM, NONE]
      ApiKeyRequired: !If [EnableApiKeyCondition, true, false]
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunction.Arn}/invocations'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true

  # CORS Options Method
  ApiOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ApiResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true

  # Lambda Permission for API Gateway
  LambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub '${ApiGateway}/*/POST/query'

  # API Gateway Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiMethod
      - ApiOptionsMethod
    Properties:
      RestApiId: !Ref ApiGateway
      StageName: !Ref ApiStageName

  # API Key (conditional)
  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    Condition: EnableApiKeyCondition
    Properties:
      Name: !Sub '${ProjectName}-api-key-${Environment}'
      Description: !Sub 'API key for ${ProjectName} - ${Environment}'
      Enabled: true
      Tags:
        - Key: Application
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # Usage Plan (conditional)
  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Condition: EnableApiKeyCondition
    Properties:
      UsagePlanName: !Sub '${ProjectName}-usage-plan-${Environment}'
      Description: !Sub 'Usage plan for ${ProjectName} - ${Environment}'
      ApiStages:
        - ApiId: !Ref ApiGateway
          Stage: !Ref ApiStageName
      Throttle:
        RateLimit: 100
        BurstLimit: 200
      Quota:
        Limit: 10000
        Period: DAY
      Tags:
        - Key: Application
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # Usage Plan Key (conditional)
  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Condition: EnableApiKeyCondition
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlan

Conditions:
  EnableApiKeyCondition: !Equals [!Ref EnableApiKey, 'true']

Outputs:
  # Lambda Outputs
  LambdaFunctionArn:
    Description: ARN of the Lambda function
    Value: !GetAtt LambdaFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaFunctionArn'
  
  LambdaFunctionName:
    Description: Name of the Lambda function
    Value: !Ref LambdaFunction
    Export:
      Name: !Sub '${AWS::StackName}-LambdaFunctionName'
  
  LambdaExecutionRoleArn:
    Description: ARN of the Lambda execution role
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaExecutionRoleArn'
  
  # API Gateway Outputs
  ApiGatewayUrl:
    Description: URL of the API Gateway endpoint
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}/query'
    Export:
      Name: !Sub '${AWS::StackName}-ApiGatewayUrl'
  
  ApiGatewayId:
    Description: ID of the API Gateway
    Value: !Ref ApiGateway
    Export:
      Name: !Sub '${AWS::StackName}-ApiGatewayId'
  
  # Secrets Manager Outputs
  SecretArn:
    Description: ARN of the F5 API credentials secret
    Value: !Ref F5ApiCredentialsSecret
    Export:
      Name: !Sub '${AWS::StackName}-SecretArn'
  
  SecretName:
    Description: Name of the F5 API credentials secret
    Value: !Ref F5SecretName
    Export:
      Name: !Sub '${AWS::StackName}-SecretName'
  
  # S3 Outputs
  AthenaResultsBucketName:
    Description: Name of the S3 bucket for Athena results
    Value: !Ref AthenaResultsBucket
    Export:
      Name: !Sub '${AWS::StackName}-AthenaResultsBucketName'
  
  # API Key Output (conditional)
  ApiKeyId:
    Condition: EnableApiKeyCondition
    Description: ID of the API key
    Value: !Ref ApiKey
    Export:
      Name: !Sub '${AWS::StackName}-ApiKeyId'