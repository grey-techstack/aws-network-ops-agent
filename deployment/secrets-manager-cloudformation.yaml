AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Secrets Manager setup for AWS Operations Agent F5 API credentials'

Parameters:
  SecretName:
    Type: String
    Default: f5-distributed-cloud-api-credentials
    Description: Name of the secret for F5 API credentials
    
  F5ApiUrl:
    Type: String
    Description: F5 Distributed Cloud API URL (e.g., https://your-tenant.console.ves.volterra.io/api)
    NoEcho: true
    
  F5ApiToken:
    Type: String
    Description: F5 API Token
    NoEcho: true
    
  F5Namespace:
    Type: String
    Default: system
    Description: F5 Namespace
    
  LambdaExecutionRoleArn:
    Type: String
    Description: ARN of the Lambda execution role that needs access to the secret

Resources:
  # F5 API Credentials Secret
  F5ApiCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Ref SecretName
      Description: F5 Distributed Cloud API credentials for AWS Operations Agent
      SecretString: !Sub |
        {
          "api_url": "${F5ApiUrl}",
          "api_token": "${F5ApiToken}",
          "namespace": "${F5Namespace}"
        }
      Tags:
        - Key: Application
          Value: aws-ops-agent
        - Key: ManagedBy
          Value: CloudFormation

  # Resource policy to allow Lambda access
  SecretResourcePolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      SecretId: !Ref F5ApiCredentialsSecret
      ResourcePolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowLambdaAccess
            Effect: Allow
            Principal:
              AWS: !Ref LambdaExecutionRoleArn
            Action: secretsmanager:GetSecretValue
            Resource: '*'

Outputs:
  SecretArn:
    Description: ARN of the F5 API credentials secret
    Value: !Ref F5ApiCredentialsSecret
    Export:
      Name: !Sub '${AWS::StackName}-SecretArn'
      
  SecretName:
    Description: Name of the F5 API credentials secret
    Value: !Ref SecretName
    Export:
      Name: !Sub '${AWS::StackName}-SecretName'